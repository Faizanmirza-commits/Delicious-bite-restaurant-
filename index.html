<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delicious Bites - Pakpattan</title>
<style>
:root { --red: #D32F2F; --gold: #FFB300; --dark: #1a1a1a; --light: #fff8f0; }
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
html { scroll-behavior: smooth; }
.hero { height: 100vh; background: linear-gradient(rgba(0,0,0,0.6), rgba(211,47,47,0.5)), url('https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=1600&q=80') center/cover no-repeat; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; color: white; padding: 20px; }
.hero h1 { font-size: 3.5rem; color: var(--gold); text-shadow: 2px 2px 4px #000; }
.btn { background: var(--gold); color: var(--dark); padding: 14px 32px; border: none; border-radius: 50px; font-size: 1.1rem; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; margin-top: 15px; }
.btn-small { padding: 8px 16px; font-size: 0.9rem; margin: 5px; }
.btn-danger { background: #555; color: white; }
section { padding: 60px 20px; max-width: 1200px; margin: auto; }
h2 { text-align: center; font-size: 2.5rem; color: var(--red); margin-bottom: 40px; }
.menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
.card { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.1); text-align: center; position: relative; }
.card img { width: 100%; height: 250px; object-fit: cover; }
.card h3 { padding: 15px 10px 5px; color: var(--dark); }
.card p { font-size: 1.2rem; color: var(--red); font-weight: bold; padding-bottom: 10px; }
.stock-badge { position: absolute; top: 10px; right: 10px; background: var(--red); color: white; padding: 5px 10px; border-radius: 20px; font-size: 0.8rem; }
.out-of-stock .stock-badge { background: #555; }
.out-of-stock img { filter: grayscale(80%); }
.float-whatsapp { position: fixed; bottom: 20px; right: 20px; background: #25D366; color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; font-weight:bold; text-decoration: none; }
footer { background:#1a1a1a; color:white; text-align:center; padding:40px 20px; }
#loginBtn, #logoutBtn { position: fixed; top: 20px; right: 20px; z-index: 1000; }
#logoutBtn { display: none; }
.admin-controls { display: none; padding: 15px; }
</style>
</head>
<body>

<button id="loginBtn" class="btn btn-small">Admin Login</button>
<button id="logoutBtn" class="btn btn-small btn-danger">Logout</button>

<section class="hero">
    <h1>Delicious Bites</h1>
    <p style="font-size:1.3rem; margin:10px 0;">Taste That You Will Remember</p>
    <p>Now Serving in Pakpattan</p>
    <a href="#menu" class="btn">Order Now on WhatsApp</a>
</section>

<section id="menu">
    <h2>Our Special Menu</h2>
    <div class="menu-grid" id="menuGrid"></div>
</section>

<footer>
    <h3>Delicious Bites</h3>
    <p>Main Bazar, Pakpattan, Punjab</p>
    <p>WhatsApp: <a href="https://wa.me/923106396034" style="color:#FFB300;">0310-6396034</a></p>
    <p style="margin-top:15px; font-size:0.9rem;">© 2026 Delicious Bites. All Rights Reserved.</p>
</footer>

<a href="https://wa.me/923106396034" class="float-whatsapp">WA</a>

<script>
let isAdmin = localStorage.getItem('adminLoggedIn') === 'true';

const menuItems = [
    { id: 1, name: "Rabri", price: 200, img: "images/rabri.jpg", stock: true },
    { id: 2, name: "Chicken Burger", price: 350, img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=600", stock: true },
    { id: 3, name: "Pizza", price: 1200, img: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=600", stock: true },
    { id: 4, name: "Biryani", price: 250, img: "https://images.unsplash.com/photo-1631515242808-497c3fddd397?w=600", stock: true },
    { id: 5, name: "Falooda", price: 180, img: "https://images.unsplash.com/photo-1551024601-bec78aea04b4?w=600", stock: true }
];

function renderMenu() {
    const menuGrid = document.getElementById('menuGrid');
    menuGrid.innerHTML = '';
    menuItems.forEach(item => {
        const card = document.createElement('div');
        card.className = `card ${!item.stock ? 'out-of-stock' : ''}`;
        card.innerHTML = `
            <img src="${item.img}" alt="${item.name}" onerror="this.src='https://placehold.co/600x400/D32F2F/FFF?text=No+Image'">
            <span class="stock-badge">${item.stock ? 'In Stock' : 'Out of Stock'}</span>
            <h3>${item.name}</h3>
            <p>Rs. ${item.price}</p>
            <div class="admin-controls" style="display: ${isAdmin ? 'block' : 'none'};">
                <button class="btn btn-small" onclick="toggleStock(${item.id})">${item.stock ? 'Mark Out' : 'Mark In'}</button>
            </div>
        `;
        menuGrid.appendChild(card);
    });
}

function toggleStock(id) {
    const item = menuItems.find(i => i.id === id);
    item.stock = !item.stock;
    renderMenu();
}

function login() {
    const pass = prompt("Enter Admin Password:");
    if(pass === "admin123"){
        localStorage.setItem('adminLoggedIn', 'true');
        isAdmin = true;
        updateUI();
    } else { alert("Wrong Password!"); }
}

function logout() {
    localStorage.removeItem('adminLoggedIn');
    isAdmin = false;
    updateUI();
}

function updateUI(){
    document.getElementById('loginBtn').style.display = isAdmin ? 'none' : 'block';
    document.getElementById('logoutBtn').style.display = isAdmin ? 'block' : 'none';
    renderMenu();
}

document.getElementById('loginBtn').onclick = login;
document.getElementById('logoutBtn').onclick = logout;

renderMenu();
</script>
</body>
</html>
